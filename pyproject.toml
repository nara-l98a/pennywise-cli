[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pennywise-cli"
version = "1.0.0"
description = "A private, local-first personal finance ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "nara-l98a" }]

[project.scripts]
pennywise = "pennywise.app:main"

[tool.setuptools.packages.find]
where = ["src"]
